name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Identificação interna da build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release label
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          case "$RELEASE_LABEL" in
            *[!A-Za-z0-9._-]*|'')
              echo "::error::release_label deve usar apenas letras, números, ponto, hífen ou sublinhado."
              exit 1
              ;;
          esac

      - name: Prepare public backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY antes de gerar a release."
            exit 1
          fi
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
          } > local.properties

      - name: Validate signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Configure o segredo obrigatório $secret_name antes de gerar a release."
              exit 1
            fi
          done

      - name: Restore delivery upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/itasuper-entregador-upload-key.jks"
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::O keystore restaurado está vazio."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/itasuper-entregador-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signed artifacts
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -s "$AAB" ] && [ -s "$APK" ]
          jarsigner -verify -certs "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner não foi encontrado no runner."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"

      - name: Collect release artifacts
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME=${VERSION_NAME:?Não foi possível identificar versionName no Gradle.}
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab \
            "dist/itasuper-entregador-${VERSION_NAME}-${RELEASE_LABEL}-${RUN_NUMBER}.aab"
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/itasuper-entregador-${VERSION_NAME}-${RELEASE_LABEL}-${RUN_NUMBER}.apk"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: itasuper-entregador-aab-${{ inputs.release_label }}-${{ github.run_number }}
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: itasuper-entregador-apk-${{ inputs.release_label }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/itasuper-entregador-upload-key.jks"
          rm -f keystore.properties local.properties
